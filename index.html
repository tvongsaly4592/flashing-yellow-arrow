<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Traffic Signal - Fixed Flashing Logic</title>
    <style>
        :root {
            --housing: #f0ad4e;
            --off: #1a1a1a;
            --red: #ff0000;
            --yellow: #ffcc00;
            --green: #00ff00;
            --glow-red: 0 0 25px #ff0000;
            --glow-yellow: 0 0 25px #ffcc00;
            --glow-green: 0 0 25px #00ff00;
            
            /* Total Cycle: 163s */
        }

        body {
            background-color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            gap: 40px;
            margin: 0;
        }

        .signal {
            background-color: var(--housing);
            padding: 15px;
            border-radius: 10px;
            border: 4px solid #111;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .bulb {
            width: 80px;
            height: 80px;
            background-color: var(--off);
            border-radius: 50%;
            border: 3px solid #000;
            position: relative;
        }

        .arrow::after {
            content: '←';
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 55px;
            font-weight: bold;
            color: rgba(0,0,0,0.5);
        }

        /* --- THROUGH SIGNALS --- */
        .through .red    { animation: thRed 163s infinite step-end; }
        .through .yellow { animation: thYellow 163s infinite step-end; }
        .through .green  { animation: thGreen 163s infinite step-end; }

        @keyframes thRed {
            0% { background-color: var(--red); box-shadow: var(--glow-red); }
            5.52% { background-color: var(--off); box-shadow: none; } /* 9s: Through turns Green */
            42.94% { background-color: var(--off); box-shadow: none; }
            44.78% { background-color: var(--red); box-shadow: var(--glow-red); } /* 73s: Through turns Red */
        }
        @keyframes thGreen {
            0% { background-color: var(--off); }
            5.52% { background-color: var(--green); box-shadow: var(--glow-green); } /* 9s to 70s */
            42.94% { background-color: var(--off); }
        }
        @keyframes thYellow {
            0% { background-color: var(--off); }
            42.94% { background-color: var(--yellow); box-shadow: var(--glow-yellow); } /* 70s to 73s */
            44.78% { background-color: var(--off); }
        }

        /* --- LEFT TURN SIGNAL --- */
        .left .green-arrow  { animation: lGreen 163s infinite step-end; }
        .left .yellow-arrow { animation: lYellow 163s infinite step-end; }
        .left .red-arrow    { animation: lRed 163s infinite step-end; }
        
        /* FLASHING YELLOW FIXED: One single animation that handles colors directly */
        .left .flash-yellow { animation: lFlashSteady 163s infinite step-end; }

        @keyframes lGreen {
            0% { background-color: var(--green); box-shadow: var(--glow-green); } /* 0-5s */
            3.06% { background-color: var(--off); }
        }

        @keyframes lYellow {
            0% { background-color: var(--off); }
            3.06% { background-color: var(--yellow); box-shadow: var(--glow-yellow); } /* 5-8s */
            4.90% { background-color: var(--off); }
            42.94% { background-color: var(--yellow); box-shadow: var(--glow-yellow); } /* 70s-73s */
            44.78% { background-color: var(--off); }
        }

        @keyframes lRed {
            0% { background-color: var(--off); }
            4.91% { background-color: var(--red); box-shadow: var(--glow-red); } /* 8s to 10s (Includes 1s delay after Through Green) */
            6.13% { background-color: var(--off); }
            44.78% { background-color: var(--red); box-shadow: var(--glow-red); } /* 73s+ */
        }

        /* THE "STEADY" FLASHING KEYFRAMES:
           This repeats the flash every 1 second (approx 0.6% of 163s) 
           but only within the 10s (6.13%) to 70s (42.94%) window.
        */
        @keyframes lFlashSteady {
            0%, 6.12% { background-color: var(--off); box-shadow: none; }
            /* Start Flashing Sequence (10s to 70s) */
            6.13%, 6.7% { background-color: var(--yellow); box-shadow: var(--glow-yellow); }
            6.71%, 7.3% { background-color: var(--off); box-shadow: none; }
            7.31%, 7.9% { background-color: var(--yellow); box-shadow: var(--glow-yellow); }
            7.91%, 8.5% { background-color: var(--off); box-shadow: none; }
            8.51%, 9.1% { background-color: var(--yellow); box-shadow: var(--glow-yellow); }
            9.11%, 9.7% { background-color: var(--off); box-shadow: none; }
            9.71%, 10.3% { background-color: var(--yellow); box-shadow: var(--glow-yellow); }
            10.31%, 10.9% { background-color: var(--off); box-shadow: none; }
            10.91%, 11.5% { background-color: var(--yellow); box-shadow: var(--glow-yellow); }
            11.51%, 12.1% { background-color: var(--off); box-shadow: none; }
            12.11%, 12.7% { background-color: var(--yellow); box-shadow: var(--glow-yellow); }
            12.71%, 13.3% { background-color: var(--off); box-shadow: none; }
            13.31%, 13.9% { background-color: var(--yellow); box-shadow: var(--glow-yellow); }
            13.91%, 14.5% { background-color: var(--off); box-shadow: none; }
            14.51%, 15.1% { background-color: var(--yellow); box-shadow: var(--glow-yellow); }
            15.11%, 15.7% { background-color: var(--off); box-shadow: none; }
            15.71%, 16.3% { background-color: var(--yellow); box-shadow: var(--glow-yellow); }
            16.31%, 16.9% { background-color: var(--off); box-shadow: none; }
            16.91%, 17.5% { background-color: var(--yellow); box-shadow: var(--glow-yellow); }
            17.51%, 18.1% { background-color: var(--off); box-shadow: none; }
            18.11%, 18.7% { background-color: var(--yellow); box-shadow: var(--glow-yellow); }
            18.71%, 19.3% { background-color: var(--off); box-shadow: none; }
            19.31%, 19.9% { background-color: var(--yellow); box-shadow: var(--glow-yellow); }
            19.91%, 20.5% { background-color: var(--off); box-shadow: none; }
            20.51%, 21.1% { background-color: var(--yellow); box-shadow: var(--glow-yellow); }
            21.11%, 21.7% { background-color: var(--off); box-shadow: none; }
            21.71%, 22.3% { background-color: var(--yellow); box-shadow: var(--glow-yellow); }
            22.31%, 22.9% { background-color: var(--off); box-shadow: none; }
            22.91%, 23.5% { background-color: var(--yellow); box-shadow: var(--glow-yellow); }
            23.51%, 24.1% { background-color: var(--off); box-shadow: none; }
            24.11%, 24.7% { background-color: var(--yellow); box-shadow: var(--glow-yellow); }
            24.71%, 25.3% { background-color: var(--off); box-shadow: none; }
            25.31%, 25.9% { background-color: var(--yellow); box-shadow: var(--glow-yellow); }
            25.91%, 26.5% { background-color: var(--off); box-shadow: none; }
            26.51%, 27.1% { background-color: var(--yellow); box-shadow: var(--glow-yellow); }
            27.11%, 27.7% { background-color: var(--off); box-shadow: none; }
            27.71%, 28.3% { background-color: var(--yellow); box-shadow: var(--glow-yellow); }
            28.31%, 28.9% { background-color: var(--off); box-shadow: none; }
            28.91%, 29.5% { background-color: var(--yellow); box-shadow: var(--glow-yellow); }
            29.51%, 30.1% { background-color: var(--off); box-shadow: none; }
            30.11%, 30.7% { background-color: var(--yellow); box-shadow: var(--glow-yellow); }
            30.71%, 31.3% { background-color: var(--off); box-shadow: none; }
            31.31%, 31.9% { background-color: var(--yellow); box-shadow: var(--glow-yellow); }
            31.91%, 32.5% { background-color: var(--off); box-shadow: none; }
            32.51%, 33.1% { background-color: var(--yellow); box-shadow: var(--glow-yellow); }
            33.11%, 33.7% { background-color: var(--off); box-shadow: none; }
            33.71%, 34.3% { background-color: var(--yellow); box-shadow: var(--glow-yellow); }
            34.31%, 34.9% { background-color: var(--off); box-shadow: none; }
            34.91%, 35.5% { background-color: var(--yellow); box-shadow: var(--glow-yellow); }
            35.51%, 36.1% { background-color: var(--off); box-shadow: none; }
            36.11%, 36.7% { background-color: var(--yellow); box-shadow: var(--glow-yellow); }
            36.71%, 37.3% { background-color: var(--off); box-shadow: none; }
            37.31%, 37.9% { background-color: var(--yellow); box-shadow: var(--glow-yellow); }
            37.91%, 38.5% { background-color: var(--off); box-shadow: none; }
            38.51%, 39.1% { background-color: var(--yellow); box-shadow: var(--glow-yellow); }
            39.11%, 39.7% { background-color: var(--off); box-shadow: none; }
            39.71%, 40.3% { background-color: var(--yellow); box-shadow: var(--glow-yellow); }
            40.31%, 40.9% { background-color: var(--off); box-shadow: none; }
            40.91%, 41.5% { background-color: var(--yellow); box-shadow: var(--glow-yellow); }
            41.51%, 42.1% { background-color: var(--off); box-shadow: none; }
            42.11%, 42.7% { background-color: var(--yellow); box-shadow: var(--glow-yellow); }
            42.71%, 42.94% { background-color: var(--off); box-shadow: none; }
            /* End Sequence */
            42.95%, 100% { background-color: var(--off); box-shadow: none; }
        }
    </style>
</head>
<body>

    <div class="signal left">
        <div class="bulb red-arrow arrow"></div>
        <div class="bulb yellow-arrow arrow"></div>
        <div class="bulb flash-yellow arrow"></div>
        <div class="bulb green-arrow arrow"></div>
    </div>

    <div class="signal through">
        <div class="bulb red"></div>
        <div class="bulb yellow"></div>
        <div class="bulb green"></div>
    </div>

    <div class="signal through">
        <div class="bulb red"></div>
        <div class="bulb yellow"></div>
        <div class="bulb green"></div>
    </div>

</body>
</html>
